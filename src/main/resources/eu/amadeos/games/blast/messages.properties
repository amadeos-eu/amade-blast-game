dialog.about.text=Lay bombs in an arena of crates, blast your way through and be the last one standing. Up to four players, on the keyboard and on gamepads; the computer takes the empty seats.
dialog.about.rules=A bomb explodes after two and a half seconds, or at once when flames reach it. Crates hide power-ups: more bombs, longer flames, faster feet. After two minutes, walls fall. Three won rounds win the match. P pauses, F11 switches to full screen and back.
