dialog.about.text=Piazza bombe in un'arena piena di casse, apriti la strada e resta l'ultimo in piedi. Fino a quattro giocatori, alla tastiera e con i gamepad; il computer occupa i posti liberi.
dialog.about.rules=Una bomba esplode dopo due secondi e mezzo, o subito quando la raggiungono le fiamme. Le casse nascondono bonus: più bombe, fiamme più lunghe, piedi più veloci. Dopo due minuti cadono muri. Tre round vinti vincono la partita. P mette in pausa, F11 passa a schermo intero e ritorna.
