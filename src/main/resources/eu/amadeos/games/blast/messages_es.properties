dialog.about.text=Ponga bombas en una arena llena de cajas, ábrase camino y sea el último en pie. Hasta cuatro jugadores, con el teclado y con mandos; el ordenador ocupa los puestos libres.
dialog.about.rules=Una bomba explota a los dos segundos y medio, o en cuanto la alcanzan las llamas. Las cajas esconden mejoras: más bombas, llamas más largas, pies más rápidos. A los dos minutos caen muros. Tres rondas ganadas ganan la partida. P hace una pausa, F11 cambia a pantalla completa y vuelve.
