dialog.about.text=Legen Sie Bomben in einer Arena voller Kisten, sprengen Sie sich den Weg frei und bleiben Sie als Letzter übrig. Bis zu vier Spieler, an der Tastatur und mit Gamepads; der Computer besetzt die freien Plätze.
dialog.about.rules=Eine Bombe explodiert nach zweieinhalb Sekunden, oder sofort, wenn Flammen sie erreichen. In Kisten stecken Extras: mehr Bomben, längere Flammen, schnellere Füße. Nach zwei Minuten fallen Mauern. Drei gewonnene Runden gewinnen das Match. P hält an, F11 schaltet ins Vollbild und zurück.
