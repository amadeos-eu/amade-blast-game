dialog.about.text=Posez des bombes dans une arène pleine de caisses, frayez-vous un chemin et soyez le dernier debout. Jusqu'à quatre joueurs, au clavier et à la manette ; l'ordinateur prend les places libres.
dialog.about.rules=Une bombe explose après deux secondes et demie, ou aussitôt que des flammes l'atteignent. Les caisses cachent des bonus : plus de bombes, des flammes plus longues, des pieds plus rapides. Après deux minutes, des murs tombent. Trois manches gagnées remportent le match. P met en pause, F11 passe en plein écran et revient.
